name: Update profile

on:
  push:
    paths:
      - profile.json
      - scripts/build_profile.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile files
        run: python scripts/build_profile.py

      - name: Commit generated files
        run: |
          if git diff --quiet -- README.md preview.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md preview.html
          git commit -m "Update generated profile"
          git push
